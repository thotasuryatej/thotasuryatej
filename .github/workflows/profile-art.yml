name: Profile art

# Redraws the contribution graph and stats card from the public contribution calendar: every hour, on push, or by hand.
# Hourly, so new commits in any repo show up within the hour; it only commits when the numbers changed.
# The ASCII portrait is not touched here; run scripts/portrait.py locally when the picture changes.

'on':
  schedule:
    - cron: '17 * * * *' # every hour, off the busy top of the hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ['contrib.svg', 'stats.svg', 'data/**']

permissions:
  contents: write

# One run at a time, so two never push over each other
concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      # The branch tip, not the commit the run started on: a re-run of an older run would otherwise draw on a
      # stale copy and have its push rejected
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Draw the graph and stats card
        run: python scripts/art.py ${{ github.repository_owner }}

      - name: Commit if anything changed
        run: |
          git add contrib.svg stats.svg data/contributions.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile art'
          git push
